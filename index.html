<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON SNAKE · 贪吃蛇</title>
    <style>
      :root { color-scheme: dark; --ink: #e8f7f1; --muted: #8aa59c; --line: rgba(151, 237, 195, .16); --mint: #62f5b0; --cyan: #67dcff; --panel: rgba(8, 25, 27, .76); }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: #061113; overflow-x: hidden; }
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .56; background: radial-gradient(circle at 13% 16%, #124b48 0, transparent 25rem), radial-gradient(circle at 90% 85%, #113a52 0, transparent 28rem), linear-gradient(rgba(145,235,196,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(145,235,196,.035) 1px, transparent 1px); background-size: auto, auto, 28px 28px, 28px 28px; }
      .app { position: relative; width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 40px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
      .brand { font-size: clamp(24px, 4vw, 38px); font-weight: 900; letter-spacing: .11em; margin: 0; text-shadow: 0 0 24px rgba(98,245,176,.32); }
      .brand span { color: var(--mint); }
      .tag { margin: 7px 0 0; color: var(--muted); letter-spacing: .12em; font-size: 12px; }
      .badge { padding: 9px 13px; border: 1px solid var(--line); border-radius: 100px; color: var(--mint); background: rgba(98,245,176,.07); font-size: 12px; white-space: nowrap; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 22px; }
      .game-card, .side-card { border: 1px solid var(--line); background: var(--panel); box-shadow: 0 20px 60px rgba(0,0,0,.2), inset 0 1px rgba(255,255,255,.025); backdrop-filter: blur(12px); }
      .game-card { position: relative; padding: 16px; border-radius: 24px; }
      .game-top { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 13px; }
      .status { color: var(--mint); font-weight: 800; letter-spacing: .08em; font-size: 13px; }
      .hint { color: var(--muted); font-size: 12px; }
      .board-wrap { position: relative; width: 100%; max-width: 640px; margin: auto; aspect-ratio: 1; overflow: hidden; border-radius: 15px; background: #07191a; border: 1px solid rgba(151,237,195,.13); }
      canvas { display: block; width: 100%; height: 100%; }
      .overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(3,14,15,.58); transition: opacity .2s; }
      .overlay.hidden { opacity: 0; pointer-events: none; }
      .overlay-box h2 { font-size: 30px; margin: 0 0 7px; letter-spacing: .08em; }
      .overlay-box p { color: #b4c9c1; margin: 0 0 20px; }
      button { border: 0; font: inherit; cursor: pointer; border-radius: 10px; padding: 12px 18px; color: #06221a; font-weight: 900; background: var(--mint); box-shadow: 0 0 22px rgba(98,245,176,.28); transition: transform .15s, filter .15s; }
      button:hover { filter: brightness(1.08); transform: translateY(-1px); }
      .side { display: grid; align-content: start; gap: 14px; }
      .side-card { padding: 18px; border-radius: 18px; }
      .label { color: var(--muted); font-size: 11px; letter-spacing: .13em; font-weight: 800; }
      .value { margin-top: 5px; color: var(--mint); font: 900 40px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.06em; }
      .best .value { color: var(--cyan); }
      .controls h3 { margin: 0 0 15px; font-size: 14px; letter-spacing: .08em; }
      .keys { display: grid; grid-template-columns: repeat(3, 38px); gap: 6px; justify-content: center; }
      kbd { border: 1px solid #31544d; border-bottom-width: 3px; padding: 8px 0; border-radius: 7px; color: #b9d5cb; text-align: center; font: 700 13px ui-monospace, monospace; background: #102525; }
      kbd:first-child { grid-column: 2; } kbd:nth-child(2) { grid-column: 1; } kbd:nth-child(3) { grid-column: 2; } kbd:nth-child(4) { grid-column: 3; }
      .tip { color: var(--muted); font-size: 12px; line-height: 1.7; margin: 13px 0 0; text-align: center; }
      .restart { width: 100%; margin-top: 2px; background: transparent; color: var(--mint); border: 1px solid rgba(98,245,176,.4); box-shadow: none; }
      @media (max-width: 760px) { .app { padding-top: 23px; } header { margin-bottom: 18px; } main { grid-template-columns: 1fr; } .side { grid-template-columns: 1fr 1fr; } .controls { grid-column: 1 / -1; } .value { font-size: 32px; } }
    </style>
  </head>
  <body>
    <div class="app">
      <header><div><h1 class="brand">NEON <span>SNAKE</span></h1><p class="tag">反应 · 节奏 · 生存</p></div><div class="badge">● 在线挑战</div></header>
      <main>
        <section class="game-card">
          <div class="game-top"><span class="status" id="status">准备就绪</span><span class="hint">方向键 / WASD 操作</span></div>
          <div class="board-wrap"><canvas id="board" width="640" height="640" aria-label="贪吃蛇游戏区域"></canvas><div class="overlay" id="overlay"><div class="overlay-box"><h2 id="overlayTitle">开始游戏</h2><p id="overlayText">吃下光点，尽可能活得更久。</p><button id="start">立即开始</button></div></div></div>
        </section>
        <aside class="side">
          <section class="side-card"><div class="label">当前得分</div><div class="value" id="score">000</div></section>
          <section class="side-card best"><div class="label">最高纪录</div><div class="value" id="best">000</div></section>
          <section class="side-card controls"><h3>操控方式</h3><div class="keys"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></div><p class="tip">按空格键暂停或继续<br>撞到边界或自己即结束</p></section>
          <button class="restart" id="restart">重新开始</button>
        </aside>
      </main>
    </div>
    <script>
      const canvas = document.querySelector('#board'), ctx = canvas.getContext('2d');
      const scoreEl = document.querySelector('#score'), bestEl = document.querySelector('#best'), statusEl = document.querySelector('#status'), overlay = document.querySelector('#overlay');
      const overlayTitle = document.querySelector('#overlayTitle'), overlayText = document.querySelector('#overlayText');
      const cells = 20, size = canvas.width / cells; let snake, food, direction, nextDirection, score, timer, playing = false, paused = false;
      let best = Number(localStorage.getItem('neon-snake-best') || 0); bestEl.textContent = String(best).padStart(3, '0');
      const randomFood = () => { do { food = { x: Math.floor(Math.random()*cells), y: Math.floor(Math.random()*cells) }; } while (snake.some(s => s.x === food.x && s.y === food.y)); };
      function reset() { clearInterval(timer); snake = [{x:10,y:11},{x:9,y:11},{x:8,y:11}]; direction = {x:1,y:0}; nextDirection = direction; score = 0; scoreEl.textContent = '000'; randomFood(); draw(); }
      function draw() { ctx.fillStyle='#07191a'; ctx.fillRect(0,0,640,640); ctx.strokeStyle='rgba(139,225,185,.08)'; ctx.lineWidth=1; for(let i=0;i<=cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,640);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*size);ctx.lineTo(640,i*size);ctx.stroke();} ctx.shadowColor='#ffcc67';ctx.shadowBlur=22;ctx.fillStyle='#ffd56e';ctx.beginPath();ctx.arc((food.x+.5)*size,(food.y+.5)*size,size*.27,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0; snake.forEach((part,i)=>{const p=6; ctx.fillStyle=i===0?'#a2ffd2':'#4cda9b';ctx.shadowColor='#44f3a3';ctx.shadowBlur=i===0?14:5;ctx.fillRect(part.x*size+p,part.y*size+p,size-p*2,size-p*2);});ctx.shadowBlur=0; }
      function tick() { if(paused) return; direction=nextDirection; const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y}; if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some(s=>s.x===head.x&&s.y===head.y)) return gameOver(); snake.unshift(head); if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=String(score).padStart(3,'0');if(score>best){best=score;localStorage.setItem('neon-snake-best',best);bestEl.textContent=String(best).padStart(3,'0');}randomFood();}else snake.pop(); draw(); }
      function start() { reset(); playing=true;paused=false;overlay.classList.add('hidden');statusEl.textContent='正在游戏';timer=setInterval(tick,125); }
      function gameOver(){clearInterval(timer);playing=false;statusEl.textContent='本局结束';overlayTitle.textContent='游戏结束';overlayText.textContent=`本次得分 ${score}，再试一次？`;document.querySelector('#start').textContent='再来一局';overlay.classList.remove('hidden');}
      function changeDirection(key){const map={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};const v=map[key];if(v&&!(v[0]===-direction.x&&v[1]===-direction.y)){nextDirection={x:v[0],y:v[1]};}}
      addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault(); if(e.key===' '&&playing){paused=!paused;statusEl.textContent=paused?'已暂停':'正在游戏';}else changeDirection(e.key);});
      document.querySelector('#start').onclick=start;document.querySelector('#restart').onclick=start; reset();
    </script>
  </body>
</html>
